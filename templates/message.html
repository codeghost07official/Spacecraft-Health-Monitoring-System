{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="card empty" style="max-width:560px; margin:40px auto">
  <span class="dz-icon">{{ icon("satellite") }}</span>
  <p class="mono muted" style="margin:0 0 6px">{{ code }}</p>
  <h1 style="font-size:1.6rem">{{ heading }}</h1>
  <p class="muted">{{ text }}</p>
  <a class="btn btn-primary" href="{{ url_for('about') }}">Go to the home page</a>
</div>
{% endblock %}
